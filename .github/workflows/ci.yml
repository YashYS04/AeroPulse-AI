name: AeroPulse AI CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Static Analysis (Oxlint)
        run: npm run lint

      - name: Run Automated Test Suites
        run: npm run test:run

      - name: Run Production TypeScript & Vite Build
        run: npm run build
